<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | IT ADM & DEV</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .terminal-container {
            border: 1px solid #00FF00;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00FF00;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .code-snippet {
            background: #1a1a1a;
            padding: 15px;
            text-align: left;
            display: inline-block;
            border-left: 4px solid #00FF00;
        }

        .nav-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid #00FF00;
            color: #00FF00;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background-color: #00FF00;
            color: #0c0c0c;
        }

        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
        }

        @keyframes blink-animation {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1>[ 404_CRITICAL_ERROR ]</h1>
        <p>El sistema no pudo encontrar la ruta solicitada.</p>
        
        <div class="code-snippet">
            tech@portfolio:~$ cd /requested_path<br>
            bash: cd: /requested_path: No such file or directory<br>
            tech@portfolio:~$ <span class="blink">_</span>
        </div>

        <br>
        <a href="index.html" class="nav-link">[ RETURN_TO_ROOT ]</a>
    </div>

</body>
</html>
